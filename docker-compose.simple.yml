version: "3.8"

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: acme_importer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    command: postgres -c shared_buffers=128MB -c max_connections=50
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 100mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - app-network

  web:
    build: .
    command: daphne -b 0.0.0.0 -p 8000 acme_importer.asgi:application
    volumes:
      - media_files:/app/media
      - static_files:/app/staticfiles
    ports:
      - "80:8000" # Expose directly on port 80
    env_file:
      - .env.prod
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/acme_importer
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  worker:
    build: .
    command: celery -A acme_importer worker -l info --concurrency=1 --max-tasks-per-child=50
    volumes:
      - media_files:/app/media
      - static_files:/app/staticfiles
    env_file:
      - .env.prod
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/acme_importer
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

volumes:
  postgres_data:
  media_files:
  static_files:

networks:
  app-network:
    driver: bridge
